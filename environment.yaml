channels:
  - i4ds
  - nvidia/label/cuda-12.9.1
  - conda-forge
  - nodefaults

dependencies:
# Set dependencies and it's constraints in the package they belong. Otherwise you just cause chaos for future builds.
# Just Karabo's direct dependencies and Karabo constraints (from our code) should be handled here.
# Dependencies with unstable APIs (this usually includes Karabo-Feedstock) should be fixed.
# Don't fix anything regarding build-string (except mpi) here. There's a lot you could do wrong.
# IMPORTANT: If you add or remove dependencies, make sure to adjust conda/meta.yaml as well.
  - python                  >=3.12,<3.13

  - aratmospy               =1.0.0
  - astropy
  - bdsf                    =1.14.1
  - bluebild                =1.0.0

  - cuda-cudart             >=12,<13
  - cuda-version            >=12,<13

  - dask                    >=2024.12,<2025.4
  - dask-mpi
  - distributed
  - eidos                   =1.1.0
  - healpy
  - h5py                    =*=mpi_mpich*
  - ipython
  - katbeam                 =0.1.0
  - libcufft
  - matplotlib
  - montagepy               =6.0.0
  - mpi4py
  - mpich
  - nbformat
  - nbconvert

  - numpy                   >=2.1.3,<2.3
  - oskarpy                 =2.12.2
  - packaging

  - pandas
  - psutil
  - reproject               >=0.9,<=10.0
  - requests
  - rfc3986                 >=2.0.0
  - scipy                   >=1.15

  - ska-gridder-nifty-cuda  =0.3.0
  - ska-sdp-datamodels      =1.0.0
  - ska-sdp-func-python     =1.0.0

  - tools21cm               =2.0.3
  - wsclean
  - xarray                  >=2024.9

  - conda-forge::fftw       =*=mpi_mpich*

  - setuptools              !=71.0.0,!=71.0.1,!=71.0.2
  # for MWA measurement set, uvfits, hdf5, mir support (choc-234)
  # pyuvdata's [casa] extra does not work with mamba;
  # install pyuvdata and python-casacore separately.
  - pyuvdata                >=2.4,<3
  - python-casacore