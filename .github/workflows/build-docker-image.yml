name: Build Docker Image

on:
  workflow_call:
    inputs:
      verstag:
        type: string
        required: true
      latest:
        type: boolean
        required: false
        default: false
      python-version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      gitrev:
        type: string
        required: false
        default: ""
        description: "gitrev: commit-hash (full) | branch | tag if not current commit."
      verstag:
        type: string
        required: true
        description: "version: PEP440 version-tag of Karabo. DON't trigger build if you don't know what PEP440 is!"
      python-version:
        type: string
        required: true
        description: "Python version to test"
      latest:
        type: boolean
        required: false
        default: false
        description: "tag image as 'latest'?"
      test:
        type: boolean
        required: false
        default: false
        description: "create env from environment.yaml instead of conda-wheel?"

env:
  REGISTRY: ghcr.io
  IMG_NAME: karabo-pipeline

jobs:
  build-test-and-push-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup metadata img-name & img-tag
        shell: bash -l {0}
        run: |
          if [[ ${{ github.event_name }} == "workflow_call" ]] || [[ ${{ github.event_name }} == "release" ]]; then
            echo "gitrev=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "build=user" >> "$GITHUB_ENV"
          elif [[ ${{ github.event_name }} == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.gitrev }}" != "" ]]; then
              echo "gitrev=${{ inputs.gitrev }}" >> "$GITHUB_ENV"
            else
              echo "gitrev=$GITHUB_SHA" >> "$GITHUB_ENV"
            fi
            if [[ "${{ inputs.test }}" == 'true' ]]; then
              echo "build=test" >> "$GITHUB_ENV"
            else
              echo "build=user" >> "$GITHUB_ENV"
            fi
          else
            echo "Invalid github-event!"
            exit 1
          fi
          echo "latest=${{ inputs.latest }}" >> "$GITHUB_ENV"
          echo "version=${{ inputs.verstag }}" >> "$GITHUB_ENV"
          REPO_OWNER=${{ github.repository_owner }}
          echo "IMG_ADDR=${{ env.REGISTRY }}/${REPO_OWNER@L}/${{ env.IMG_NAME }}" >> "$GITHUB_ENV"
          DEV_STR="dev"
          if [[ "${{ inputs.verstag }}" == *"$DEV_STR"* ]] && [[ "${{ inputs.latest }}" == 'true' ]]; then
            echo "Invalid configuration of workflow-inputs!"
            exit 1
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw, enable=${{ env.latest }}, value=latest
            type=raw, value=${{ env.version }}

      - name: Docker build
        shell: bash -el {0}
        run: |
          docker build \
            --platform "${{ matrix.platform }}" \
            --build-arg GIT_REV=${{ env.gitrev }} \
            --build-arg BUILD=${{ env.build }} \
            --build-arg KARABO_VERSION=${{ env.version }} \
            --build-arg PYTHON_VERSION=${{ inputs.python-version }} \
            -f Dockerfile \
            -t "${{ env.IMG_ADDR }}:build-${{ github.run_id }}-${{ matrix.arch }}" \
            .

      - name: Test image
        run: |
          docker run --rm "${{ env.IMG_ADDR }}:build-${{ github.run_id }}-${{ matrix.arch }}" bash -ec \
            'export IS_GITHUB_RUNNER=true RUN_GPU_TESTS=false RUN_NOTEBOOK_TESTS=false;
            python -m pytest --pyargs karabo.test;
            SITE_PKGS=$(python -m pip show karabo-pipeline | grep Location | sed "s/Location: //g");
            mpirun -n 2 python -m pytest --only-mpi "$SITE_PKGS/karabo/test"'

      - name: Docker push
        shell: bash -el {0}
        run: |
          docker push "${{ env.IMG_ADDR }}:build-${{ github.run_id }}-${{ matrix.arch }}"

  publish-manifest:
    needs: build-test-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        shell: bash -el {0}
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.verstag }}
          TAG_LATEST: ${{ inputs.latest }}
        run: |
          image="${REGISTRY}/${REPO_OWNER,,}/${IMG_NAME}"
          source_tag="build-${GITHUB_RUN_ID}"

          tags=(--tag "$image:$VERSION")
          if [[ "$TAG_LATEST" == "true" ]]; then
            tags+=(--tag "$image:latest")
          fi

          docker buildx imagetools create \
            "${tags[@]}" \
            "$image:${source_tag}-amd64" \
            "$image:${source_tag}-arm64"

          docker buildx imagetools inspect "$image:$VERSION"